<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SnapKart | Admin Authentication</title>
  
  <link rel="icon" type="image/svg+xml" href="../../static/images/favicon.svg">
  <link rel="stylesheet" href="../../static/css/variables.css">
  <link rel="stylesheet" href="../../static/css/base.css">
  <link rel="stylesheet" href="../../static/css/components.css">
  <link rel="stylesheet" href="../../static/css/admin.css">
</head>
<body style="background: var(--color-bg); min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between;">

  <!-- Simple Header -->
  <header style="padding: var(--space-4) 0; border-bottom: 1px solid var(--color-border); background: var(--color-surface);">
    <div class="container" style="max-width: 960px; display: flex; align-items: center; justify-content: space-between;">
      <a href="../../index.html" class="sk-brand" style="text-decoration: none;">
        <img src="../../static/images/logo.svg" alt="SnapKart" style="height: 34px;">
      </a>
      <span class="badge badge-navy" style="font-size: 11px;">RESTRICTED PLATFORM CONSOLE</span>
    </div>
  </header>

  <!-- Login Main -->
  <main class="container" style="max-width: 440px; padding: var(--space-10) var(--space-4);">
    <div class="card p-6" style="box-shadow: var(--shadow-lg); border-top: 4px solid var(--color-primary);">
      
      <div style="text-align: center; margin-bottom: var(--space-6);">
        <div style="width: 52px; height: 52px; border-radius: var(--radius-lg); background: var(--color-primary); color: white; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: var(--space-3);">
          🛡️
        </div>
        <h2 style="font-size: var(--font-size-xl); margin-bottom: 4px;">Staff & Operations Login</h2>
        <p class="text-xs text-muted" style="margin-bottom: 0;">Authorized SnapKart Platform Administrators Only</p>
      </div>

      <div class="alert alert-warning mb-4" style="font-size: 12px; padding: 0.5rem 0.75rem;">
        <span class="alert-icon">🔒</span>
        <div class="alert-content">
          <strong>Restricted Area:</strong> All access attempts and administrative modifications are audited.
        </div>
      </div>

      <form onsubmit="event.preventDefault(); window.location.href='index.html';">
        <div class="form-group">
          <label class="form-label">Internal Email</label>
          <input type="email" class="form-control" value="admin@snapkart.internal" required>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" value="••••••••••••" required>
        </div>

        <div class="form-group">
          <label class="form-label">Security Role</label>
          <select class="form-select" disabled style="background:#F1F5F9;">
            <option>Super Administrator (Level 1 Operations)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-lg" style="width: 100%; margin-top: var(--space-3);">
          Log In to Operations Console →
        </button>
      </form>

      <div style="text-align: center; margin-top: var(--space-5); border-top: 1px solid var(--color-border); padding-top: var(--space-4);">
        <a href="../../index.html" class="text-xs text-muted" style="text-decoration: none;">
          ← Return to SnapKart Landing Page
        </a>
      </div>

    </div>
  </main>

  <!-- Simple Footer -->
  <footer style="padding: var(--space-4) 0; border-top: 1px solid var(--color-border); background: var(--color-surface); text-align: center;">
    <div class="container text-xs text-muted">
      SnapKart Operations Infrastructure • Django Ready Architecture
    </div>
  </footer>

</body>
</html>
